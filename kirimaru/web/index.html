<!doctype html>
<html><head><meta charset="utf-8"><title>KirimaruAI</title>
<style>
body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 16px;background:#111;color:#eee}
input,select{width:100%;padding:8px;margin:4px 0 12px;background:#222;color:#eee;border:1px solid #444;border-radius:6px;box-sizing:border-box}
button{padding:10px 18px;background:#6d5efc;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-right:6px}
.clip{background:#1c1c1c;padding:12px;border-radius:8px;margin:10px 0}
pre{white-space:pre-wrap;color:#f99}
</style></head><body>
<h2>KirimaruAI</h2>
<label>Genre / topic (optional, adds DuckDuckGo trend context)</label>
<input id="genre" placeholder="e.g. valorant clutches, cooking fails">
<label>Video URL (YouTube, Twitch, TikTok, Instagram, ...)</label>
<input id="url" placeholder="https://...">
<div style="display:flex;gap:12px">
  <div style="flex:1"><label>Max clips</label><input id="max" type="number" value="5"></div>
  <div style="flex:1"><label>Budget (USD)</label><input id="budget" type="number" step="0.1" value="0.5"></div>
</div>
<label>Scorer model (role or key)</label><select id="scorer"></select>
<label>Refiner model</label><select id="refiner"></select>
<label><input type="checkbox" id="mm" style="width:auto"> Use multimodal (audio/video) model</label>
<label>Multimodal model</label><select id="mmm"></select>
<p><button id="go">Find clips</button><button id="refresh" style="background:#333">Refresh model list from OpenRouter</button></p>
<div id="out"></div>
<script>
function loadModels(){
  fetch('/api/models').then(r=>r.json()).then(d=>{
    for(const id of ['scorer','refiner','mmm']) document.getElementById(id).innerHTML='';
    const keys=Object.keys(d.models);
    for(const id of ['scorer','refiner','mmm']){
      const s=document.getElementById(id);
      for(const k of keys){const o=document.createElement('option');o.value=k;o.textContent=`${k} (${d.models[k].id})`;s.appendChild(o);}
    }
    document.getElementById('scorer').value='cheap_text';
    document.getElementById('refiner').value='strong_text';
    document.getElementById('mmm').value='video_audio';
  });
}
loadModels();
document.getElementById('refresh').onclick=async()=>{
  const out=document.getElementById('out');out.textContent='Fetching...';
  const j=await (await fetch('/api/catalog')).json();
  out.textContent = j.error ? j.error : `Fetched ${j.length} models from OpenRouter (cached).`;
};
document.getElementById('go').onclick=async()=>{
  const out=document.getElementById('out');out.textContent='Working...';
  const body={url:url.value,max_clips:+max.value,budget:+budget.value,multimodal:mm.checked,
    scorer:scorer.value,refiner:refiner.value,multimodal_model:mmm.value,genre:genre.value};
  const j=await (await fetch('/api/run',{method:'POST',body:JSON.stringify(body)})).json();
  if(j.error){out.innerHTML='<pre></pre>';out.firstChild.textContent=j.error;return;}
  out.innerHTML=`<p>Mode: ${j.mode} · Spent: $${j.spent_usd}</p>`+j.clips.map(c=>
    `<div class="clip"><b>${c.title}</b><br>${c.start}s → ${c.end}s<br><i>${c.hook||''}</i><br><small>${c.file}</small></div>`).join('');
};
</script></body></html>
